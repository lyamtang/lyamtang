<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0f172a"/>

  <!-- Title -->
  <text x="800" y="56" font-family="system-ui,sans-serif" font-size="26" fill="#f8fafc" font-weight="700" text-anchor="middle">System Architecture</text>
  <text x="800" y="84" font-family="system-ui,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">End-to-end data flow: IoT sensors to caregiver apps</text>

  <!-- LAYER LABELS -->
  <text x="200" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="1.5">HARDWARE</text>
  <text x="560" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="1.5">INGESTION</text>
  <text x="920" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="1.5">STORAGE</text>
  <text x="1280" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="1.5">DELIVERY</text>

  <!-- Layer 1: IoT Sensors -->
  <rect x="60" y="148" width="280" height="104" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="186" font-family="system-ui,sans-serif" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle">IoT Sensors</text>
  <text x="200" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Heart rate · Blood pressure</text>
  <text x="200" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">SpO2 · Temperature</text>
  <text x="200" y="240" font-family="system-ui,sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">TCP/UDP streams</text>

  <!-- Arrow: IoT → Go -->
  <line x1="340" y1="200" x2="418" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="418,193 436,200 418,207" fill="#38bdf8"/>
  <text x="377" y="188" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">raw data</text>

  <!-- Layer 2: Go Service -->
  <rect x="436" y="148" width="248" height="104" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="560" y="186" font-family="system-ui,sans-serif" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle">Go Service</text>
  <text x="560" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Data ingestion</text>
  <text x="560" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Threshold checks · Alerts</text>
  <text x="560" y="240" font-family="system-ui,sans-serif" font-size="10" fill="#22d3ee" text-anchor="middle">goroutine-per-device</text>

  <!-- Arrow: Go → PostgreSQL -->
  <line x1="684" y1="200" x2="762" y2="200" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="762,193 780,200 762,207" fill="#22d3ee"/>
  <text x="723" y="188" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">write</text>

  <!-- Layer 3: PostgreSQL -->
  <rect x="780" y="148" width="280" height="104" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="920" y="186" font-family="system-ui,sans-serif" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="920" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Time-series health records</text>
  <text x="920" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Patient profiles · Audit logs</text>
  <text x="920" y="240" font-family="system-ui,sans-serif" font-size="10" fill="#22d3ee" text-anchor="middle">partitioned by date</text>

  <!-- Arrow: PostgreSQL → WebSocket -->
  <line x1="1060" y1="200" x2="1138" y2="200" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="1138,193 1156,200 1138,207" fill="#a78bfa"/>
  <text x="1099" y="188" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">read</text>

  <!-- Layer 4: WebSocket -->
  <rect x="1156" y="148" width="280" height="104" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1296" y="186" font-family="system-ui,sans-serif" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle">WebSocket</text>
  <text x="1296" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Real-time event bus</text>
  <text x="1296" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Alert push · Live vitals</text>
  <text x="1296" y="240" font-family="system-ui,sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">&lt;500ms latency</text>

  <!-- Arrows down to client layer -->
  <line x1="1230" y1="252" x2="1090" y2="390" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="1082,382 1090,398 1100,386" fill="#a78bfa"/>

  <line x1="1362" y1="252" x2="1450" y2="390" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="1442,382 1450,398 1460,386" fill="#a78bfa"/>

  <!-- CLIENT LAYER -->
  <text x="800" y="376" font-family="system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="1.5">CLIENT LAYER</text>

  <!-- React Native App -->
  <rect x="920" y="394" width="280" height="104" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1060" y="432" font-family="system-ui,sans-serif" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle">React Native</text>
  <text x="1060" y="454" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Caregiver mobile app</text>
  <text x="1060" y="474" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">iOS &amp; Android</text>
  <text x="1060" y="488" font-family="system-ui,sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">offline-first design</text>

  <!-- Web Dashboard -->
  <rect x="1320" y="394" width="240" height="104" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1440" y="432" font-family="system-ui,sans-serif" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle">Web Dashboard</text>
  <text x="1440" y="454" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Admin + Analytics</text>
  <text x="1440" y="474" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">React · TypeScript</text>
  <text x="1440" y="488" font-family="system-ui,sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">shared design tokens</text>

  <!-- Design decision callouts (left panel) -->
  <text x="60" y="380" font-family="system-ui,sans-serif" font-size="16" fill="#f1f5f9" font-weight="700">Design Decisions</text>

  <rect x="60" y="400" width="400" height="90" rx="8" fill="#1e293b"/>
  <rect x="60" y="400" width="4" height="90" rx="2" fill="#38bdf8"/>
  <text x="80" y="428" font-family="system-ui,sans-serif" font-size="13" fill="#38bdf8" font-weight="600">Go for Ingestion</text>
  <text x="80" y="450" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Goroutine-per-device model scales to 1000+</text>
  <text x="80" y="468" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">concurrent sensors with minimal memory overhead.</text>
  <text x="80" y="482" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">vs. Node.js: 3x lower memory footprint in load tests.</text>

  <rect x="60" y="504" width="400" height="90" rx="8" fill="#1e293b"/>
  <rect x="60" y="504" width="4" height="90" rx="2" fill="#22d3ee"/>
  <text x="80" y="532" font-family="system-ui,sans-serif" font-size="13" fill="#22d3ee" font-weight="600">PostgreSQL + Time-Series Index</text>
  <text x="80" y="554" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Date-partitioned tables for efficient 30-day range</text>
  <text x="80" y="572" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">queries without full table scans.</text>
  <text x="80" y="586" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">ACID guarantees critical for health record integrity.</text>

  <rect x="60" y="608" width="400" height="90" rx="8" fill="#1e293b"/>
  <rect x="60" y="608" width="4" height="90" rx="2" fill="#a78bfa"/>
  <text x="80" y="636" font-family="system-ui,sans-serif" font-size="13" fill="#a78bfa" font-weight="600">WebSocket over HTTP Polling</text>
  <text x="80" y="658" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Bidirectional push delivers alerts in &lt;500ms.</text>
  <text x="80" y="676" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">HTTP polling at 5s intervals was unacceptable</text>
  <text x="80" y="690" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">for emergency health monitoring scenarios.</text>

  <rect x="60" y="712" width="400" height="90" rx="8" fill="#1e293b"/>
  <rect x="60" y="712" width="4" height="90" rx="2" fill="#f59e0b"/>
  <text x="80" y="740" font-family="system-ui,sans-serif" font-size="13" fill="#f59e0b" font-weight="600">Offline-First Mobile</text>
  <text x="80" y="762" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Local alert queue with exponential back-off</text>
  <text x="80" y="780" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">ensures zero missed critical alerts on reconnect.</text>
  <text x="80" y="794" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Validated in simulated poor-connectivity tests.</text>

  <!-- Outcome box -->
  <rect x="560" y="540" width="1000" height="80" rx="12" fill="#1d4ed8" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="1060" y="572" font-family="system-ui,sans-serif" font-size="15" fill="#93c5fd" font-weight="700" text-anchor="middle">Result</text>
  <text x="1060" y="598" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">60% faster response · ~40% fewer false alerts · Zero missed alerts · Delivered in 6 months</text>

  <!-- Secondary outcomes -->
  <rect x="560" y="644" width="476" height="76" rx="8" fill="#1e293b"/>
  <text x="798" y="672" font-family="system-ui,sans-serif" font-size="12" fill="#86efac" font-weight="600" text-anchor="middle">Scalability</text>
  <text x="798" y="696" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Architecture supports 1000+ concurrent patients</text>
  <text x="798" y="712" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">without redesign of core services</text>

  <rect x="1060" y="644" width="500" height="76" rx="8" fill="#1e293b"/>
  <text x="1310" y="672" font-family="system-ui,sans-serif" font-size="12" fill="#a78bfa" font-weight="600" text-anchor="middle">Recognition</text>
  <text x="1310" y="696" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Presented to 3 healthcare organisations</text>
  <text x="1310" y="712" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">for potential pilot program consideration</text>
</svg>
