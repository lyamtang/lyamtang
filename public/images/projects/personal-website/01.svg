  <text x="64" y="38" font-family="system-ui,sans-serif" font-size="18" fill="#f8fafc" font-weight="800">LT</text>
  <text x="1080" y="36" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">About</text>
  <text x="1180" y="36" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">Experience</text>
  <text x="1318" y="36" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">Projects</text>
  <text x="1446" y="36" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">Contact</text>
  <!-- Mode toggle -->
  <rect x="1530" y="18" width="48" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
