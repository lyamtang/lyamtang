  <rect x="646" y="666" width="96" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="694" y="683" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Tailwind CSS v4</text>

  <rect x="756" y="666" width="88" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="800" y="683" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Framer Motion</text>

  <rect x="858" y="666" width="72" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="894" y="683" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">shadcn/ui</text>

  <rect x="944" y="666" width="104" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="996" y="683" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">TypeScript</text>

