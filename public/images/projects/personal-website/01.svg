  <line x1="0" y1="200" x2="1600" y2="200" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
