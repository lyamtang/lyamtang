  <text x="800" y="444" font-family="system-ui,sans-serif" font-size="24" fill="#a78bfa" text-anchor="middle" font-weight="500">Software Developer &amp; Product Manager</text>
  <text x="800" y="490" font-family="system-ui,sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Building products at the intersection of technology and human experience.</text>
  <text x="800" y="514" font-family="system-ui,sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Currently at HKUST.</text>

  <!-- CTA Buttons -->
