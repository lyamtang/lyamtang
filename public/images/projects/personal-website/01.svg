  <text x="800" y="790" font-family="system-ui,sans-serif" font-size="12" fill="#475569" text-anchor="middle">scroll to explore</text>
  <line x1="800" y1="798" x2="800" y2="850" stroke="#334155" stroke-width="1" stroke-dasharray="3,4"/>
  <circle cx="800" cy="856" r="4" fill="#334155"/>

