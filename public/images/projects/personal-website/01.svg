  <text x="732" y="582" font-family="system-ui,sans-serif" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">View Projects</text>

  <rect x="836" y="552" width="168" height="48" rx="10" fill="transparent" stroke="#334155" stroke-width="1.5"/>
  <text x="920" y="582" font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Get in Touch</text>

