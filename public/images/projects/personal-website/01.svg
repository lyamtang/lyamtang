  <text x="800" y="290" font-family="system-ui,sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="3">HELLO, I'M</text>
  <text x="800" y="380" font-family="system-ui,sans-serif" font-size="80" fill="#f8fafc" font-weight="800" text-anchor="middle">Lyam Tang</text>

